    .pill {

    .pi {
      display: flex;
      align-items: center;

    .pt { display: block; font-size: 22px; letter-spacing: 1px; color: #ff8a1f; text-transform: uppercase; text-shadow: 0 2px 0 #5a2a00; }
    .ps { display: block; font-size: 10px; letter-spacing: 0.8px; color: #f3e3c8; text-transform: uppercase; margin-top: 2px; }
    .sec { max-width: 1180px; margin: 0 auto; padding: 12px 16px 110px; }
    .bk {

    .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
    .it {

      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;

    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .pr { font-weight: 700; font-size: 16px; color: var(--tx); }
    button { font: inherit; cursor: pointer; }
    .add {
      background: var(--ac);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;

    footer { text-align: center; color: var(--mu); font-size: 12px; padding: 24px 12px 120px; line-height: 1.6; }

    #bar {

      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--card);
      border-top: 1px solid var(--bd);

      z-index: 9;

    #bar button {

      color: #fff;

      border-radius: 12px;
      padding: 14px;
      font-weight: 700;

    #dr {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 20;
      align-items: flex-end;
      justify-content: center;
    }
    #dr.on { display: flex; }
    #pn {
      background: var(--card);
      width: 100%;
      max-width: 520px;
      max-height: 85%;
      overflow: auto;
      border-radius: 16px 16px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      border: 1px solid var(--bd);
    }
    .ci { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--bd); font-size: 14px; }
    .q { display: flex; align-items: center; gap: 8px; }
    .q button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--bd); background: #221a10; color: var(--tx); font-weight: 700; }
    .tot { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; margin: 16px 0 8px; color: var(--ac); }
    .wa { display: block; text-align: center; background: #25a244; color: #fff; text-decoration: none; border-radius: 12px; padding: 14px; font-weight: 700; margin-top: 12px; font-size: 16px; }
    .x { float: right; background: none; border: 0; font-size: 24px; color: var(--tx); cursor: pointer; }

    @media (min-width: 900px) {
      #home { max-width: 960px; grid-template-columns: 1fr 1fr; gap: 22px; padding-top: 32px; }
      .pt { font-size: 26px; }
      .ps { font-size: 11px; }
      #bar { left: auto; right: 24px; bottom: 24px; width: auto; border: 1px solid var(--bd); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); padding: 12px; }
      #bar button { padding: 14px 28px; }
      #dr { align-items: center; }
      #pn { border-radius: 16px; max-height: 80%; }
    }

var C = {}, $ = function(i){ return document.getElementById(i); };

D.forEach(function(c, i){

  c[1].forEach(function(p, j){

  });
  h += '</div></section>';
});

var S = ["Los favoritos que tienes que probar", "Para los amantes de las salchipapas", "Las mejores mazorcadas", "Amantes a los perros", "Asados especiales", "Alitas provocativas", "Todas las bebidas", "Sandwiches de Calidad"];
var I = ["🍔", "🍟", "🌽", "🌭", "🥩", "🍗", "🥤", "🥪"];
var ph = "";

D.forEach(function(c, i){
  ph += '<button class="pill" onclick="go(' + i + ')"><span class="pi"><span class="pe">' + I[i] + '</span><span class="pm"><span class="pt">' + c[0] + '</span><span class="ps">' + S[i] + '</span></span></span></button>';
});

$("home").innerHTML = ph;
$("m").innerHTML = h;

function go(i){
  $("home").hidden = true;
  document.querySelectorAll(".sec").forEach(function(e){ e.hidden = true; });
  $("c" + i).hidden = false;
  window.scrollTo(0, 0);
}

function home(){
  document.querySelectorAll(".sec").forEach(function(e){ e.hidden = true; });
  $("home").hidden = false;
  window.scrollTo(0, 0);
}

function ad(i, j){
  var p = D[i][1][j], k = i + "-" + j;
  C[k] = C[k] || { n: p[0], p: p[2], q: 0 };
  C[k].q++;
  up();
}

function ch(k, d){
  C[k].q += d;
  if(C[k].q <= 0) delete C[k];
  up();
  rd();
}

function sm(){
  var q = 0, t = 0;
  for(var k in C){ q += C[k].q; t += C[k].q * C[k].p; }
  return [q, t];
}

function up(){
  var s = sm();
  $("bar").style.display = s[0] ? "block" : "none";
  $("bb").textContent = "Ver carrito (" + s[0] + ") · " + f(s[1]);
}

function rd(){
  var s = sm(), o = '<button class="x" onclick="cl()">×</button><h2 style="margin-top:0">Tu pedido</h2>';
  if(!s[0]){ cl(); return; }
  var m = "Hola Smash Burger, quiero pedir a domicilio:%0A";
  for(var k in C){
    var c = C[k];
    o += '<div class="ci"><span>' + c.n + '<br><small>' + f(c.p * c.q) + '</small></span><span class="q"><button onclick="ch(\'' + k + '\',-1)">−</button>' + c.q + '<button onclick="ch(\'' + k + '\',1)">+</button></span></div>';
    m += c.q + "x " + encodeURIComponent(c.n) + "%0A";
  }
  o += '<div class="tot"><span>Total</span><span>' + f(s[1]) + '</span></div>';
  o += '<a class="wa" target="_blank" href="https://wa.me/573008298317?text=' + m + '%0ATotal: ' + encodeURIComponent(f(s[1])) + '">Pedir por WhatsApp</a>';
  $("pn").innerHTML = o;
}

function op(){ rd(); $("dr").classList.add("on"); }
function cl(){ $("dr").classList.remove("on"); }
</script>
